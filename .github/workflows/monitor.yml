name: SoundCloud monitor
on:
  push:
    paths:
      - "monitor_once.py"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: soundcloud-profile-monitor
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - name: Check public SoundCloud profile
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOUNDCLOUD_PROFILE_URL: https://soundcloud.com/skellx
        run: python monitor_once.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update SoundCloud monitor state"
            git pull --rebase origin main
            git push
          fi
